<div class="zone" style="left: 75px; top: 110px; width: 240px; height: 240px"></div>
<div class="zone-next" style="left: 150px; top: 185px; width: 90px; height: 90px"></div>

<div class="handle" style="left: 184px; top: 99px"></div>

<span class="abs xs mu b7" style="left: 108px; top: 360px">Drag the handles to resize</span>
</div>
<div class="shade-top" style="height: 140px"></div>
<div class="top"><a class="ib" href="PlaySheet.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><span class="h3">Host Chase</span><span class="founder">FOUNDER</span></div>

<div class="row between"><div class="col"><span class="b7">Shrinking zone</span><span class="xs mu">Every 10 min, down to 400 m</span></div><span class="sw on" role="img" aria-label="On"></span></div>
<a class="btn btn-lime" href="Invite.dc.html" style="flex: none">Create game</a>
</div>
</div>
